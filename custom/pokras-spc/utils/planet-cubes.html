<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расшифровка систем · кубы</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b1a2f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .card {
      position: absolute;
      top: 16px;
      max-width: 820px;
      width: 100%;
      background: #eef4fa;
      background: linear-gradient(145deg, #f5f9ff 0%, #dce6f0 100%);
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 10, 25, 0.6), inset 0 1px 3px rgba(255, 255, 255, 0.6);
      padding: 1.5rem;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0d2b44;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 2px solid #8aa9c9;
      padding-bottom: 0.65rem;
      margin-bottom: 1.8rem;
    }

    h1 small {
      font-size: 1rem;
      font-weight: 400;
      color: #2a4b6e;
      margin-left: auto;
      background: #c3d7ec;
      padding: 0.15rem 1rem;
      border-radius: 40px;
      letter-spacing: 0.2px;
    }

    .input-area {
      background: #ffffffcc;
      backdrop-filter: blur(2px);
      padding: 1.5rem 1.5rem 1.2rem;
      border-radius: 2rem;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04), 0 6px 12px rgba(0, 18, 40, 0.12);
      /* margin-bottom: 2rem; */
    }

    label {
      display: block;
      font-weight: 500;
      color: #1d3e5e;
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    textarea {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-family: 'Consolas', 'Fira Code', monospace;
      background: #f2f8ff;
      border: 2px solid #b8cee5;
      border-radius: 1.4rem;
      resize: vertical;
      min-height: 110px;
      color: #06233b;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.03);
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: #3f7ca8;
      background: #ffffff;
      box-shadow: 0 0 0 4px #a7c4e2;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      margin-top: 1.2rem;
      align-items: center;
      justify-content: space-between;
    }

    .btn {
      background: #1f4569;
      border: none;
      padding: 0.7rem 2.2rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 0 #0c253b, 0 4px 12px rgba(0, 20, 40, 0.3);
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background: #265a85;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #0c253b, 0 8px 18px rgba(0, 20, 40, 0.35);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0c253b;
    }

    .btn-outline {
      background: transparent;
      box-shadow: 0 0 0 2px #34648b, 0 2px 6px rgba(0,0,0,0.05);
      color: #1f4569;
      font-weight: 500;
      padding: 0.6rem 1.8rem;
    }

    .btn-outline:hover {
      background: #d7e5f5;
      box-shadow: 0 0 0 2px #265a85, 0 4px 10px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .result-box {
      background: #0d1d30;
      border-radius: 2rem;
      padding: 1.6rem 1.8rem 1.8rem;
      margin-top: 1rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      color: #abc0d6;
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 0.4px;
      border-bottom: 1px dashed #3a5a78;
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .planet-system {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .system-row {
      background: #122b41;
      border-radius: 2.5rem;
      padding: 0.75rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.4rem 1.2rem;
      border-left: 6px solid #3e7b9e;
      box-shadow: inset 0 1px 3px #2d4d66;
    }

    .system-row .sys-label {
      font-weight: 600;
      color: #b4d4f0;
      min-width: 110px;
      font-size: 1rem;
    }

    .planet-tag {
      display: inline-block;
      background: #1f405b;
      padding: 0.2rem 1rem 0.25rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #e7f0fa;
      letter-spacing: 0.3px;
      border: 1px solid #4b7b9b;
      box-shadow: inset 0 1px 2px #7ba2c0;
    }

    .planet-tag span {
      font-weight: 300;
      color: #b2d0ea;
      margin-right: 5px;
    }

    .planet-tag.type-A { background: #7a3e1f; border-color: #c27a4a; }
    .planet-tag.type-B { background: #2b6d4b; border-color: #5daa7a; }
    .planet-tag.type-C { background: #1d5780; border-color: #4b9bc9; }
    .planet-tag.type-D { background: #3b4c63; border-color: #7e93b0; }
    .planet-tag.type-E { background: #4a4a4a; border-color: #8a8a8a; }
    .planet-tag.type-F { background: #7a5f3a; border-color: #be9b6a; }

    .meta-info {
      color: #a6c0d8;
      font-size: 0.85rem;
      background: #1a3146;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      margin-left: auto;
      white-space: nowrap;
    }

    .empty-state {
      color: #869eb6;
      padding: 1.2rem 0.5rem;
      text-align: center;
      font-style: italic;
      background: #102433;
      border-radius: 3rem;
    }

    .badge {
      display: inline-block;
      background: #234b69;
      border-radius: 40px;
      padding: 0.1rem 1rem;
      color: #dcebfa;
      font-size: 0.8rem;
      font-weight: 400;
    }

    .footnote {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #4f6e89;
      text-align: right;
    }

    @media (max-width: 580px) {
      .card { padding: 1.5rem; }
      .system-row { flex-direction: column; align-items: stretch; }
      .meta-info { margin-left: 0; white-space: normal; }
    }
  </style>
</head>
<body>
<div class="card">
  <h2>
    ⚡ Расшифровка системы
  </h2>

  <div class="input-area">
    Нажмите чтобы скопировать (не больше 3 в одном посте)
    <pre 
      onclick="this.style.backgroundColor='#4cd67d'; navigator.clipboard.writeText(this.textContent); setTimeout(() => this.style.backgroundColor='transparent', 100)" 
      title="Нажмите чтобы скопировать">
##1d6##
##4d6##
##1d20##
</pre>
    <label for="diceInput">Вставьте результаты бросков (1d6, 4d6, 1d20) в одно поле:
    </label>
    <textarea id="diceInput" placeholder="Например:&#10;1d6: (4) = 4 количество планет&#10;4d6: (5 + 6 + 2 + 6) = 19 типы планет"></textarea>
    <div class="actions">
      <button class="btn" id="decodeBtn">🔮 Расшифровать</button>
      <button class="btn btn-outline" id="removeLinesBtn">🗑️ Удалить 4 строки</button>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <!-- <div class="result-header">
      <span>🪐 Система</span>
    </div> -->
    <div id="systemContainer">
      <div class="empty-state">⏳ Вставьте броски и нажмите «Расшифровать»</div>
    </div>
    <div class="footnote" id="planetLegend">A-горячий · B-умеренный · C-водный · D-холодный · E-скала · F-газовый</div>
  </div>
</div>

<script>
  (function() {
    // ---- Словарь типов ----
    const TYPE_MAP = {
      1: { letter: 'A', name: 'горячий мир', class: 'type-A' },
      2: { letter: 'B', name: 'умеренный мир', class: 'type-B' },
      3: { letter: 'C', name: 'водный мир', class: 'type-C' },
      4: { letter: 'D', name: 'холодный мир', class: 'type-D' },
      5: { letter: 'E', name: 'безжизненный мир (скала)', class: 'type-E' },
      6: { letter: 'F', name: 'газовый гигант', class: 'type-F' }
    };

    // ---- Словарь особенностей системы (1d20) ----
    // Формат: "Название": [массив значений кубика]
    const FEATURE_MAP = {
      "критическая задница (мастер выбирает эффект или придумывает уникальный)": [1],
      "нет особенностей": [2, 3, 4, 5, 6, 7, 8, 9],
      "древний артефакт (+10 ОИ разово)": [10],
      "аборигены: средневековье (замок)": [11],
      "аборигены: индустриальный век (офисы)": [12],
      "аборигены: вышли в космос (колония 1 ур. + станция на своей планете)": [13],
      "аборигены: колонизировали звездную систему (колония 2 ур., станции, военные корабли)": [14],
      "космический монстр (система хороша для колонизации, доп. бросок 1d5 или как мастер решит)": [15, 16],
      "пираты (1d3 фрегата)": [17, 18],
      "обломки неизвестного корабля (1d3: металлы/соседняя система/фрегат)": [19],
      "критическая удача (мастер выбирает эффект или придумывает уникальный)": [20]
    };

    // Родной тип (для колонизации) – пусть будет B (умеренный), как в правилах
    const NATIVE_TYPE = 2;   // B

    // DOM
    const textarea = document.getElementById('diceInput');
    const decodeBtn = document.getElementById('decodeBtn');
    const exampleBtn = document.getElementById('exampleBtn');
    const systemContainer = document.getElementById('systemContainer');

    // ---- парсинг ----
    function parseDiceResults(input) {
      // очистим лишние пробелы, но оставим структуру
      const lines = input.split('\n').map(line => line.trim()).filter(line => line.length > 0);

      let planetCount = null;
      let typeRolls = [];
      let featureRoll = null; // Новая переменная для 1d20

      // проходим по строкам, ищем 1d6, 4d6 и 1d20
      for (let line of lines) {
        // ищем 1d6: (X) = Y ...
        const pCountMatch = line.match(/1d6\s*:\s*\((\d+)\)\s*=\s*(\d+)/i);
        if (pCountMatch) {
          const val = parseInt(pCountMatch[2], 10);
          if (!isNaN(val) && val >= 1 && val <= 6) {
            // Маппинг: 1→1, 2-3→2, 4-5→3, 6→4
            if (val === 1) planetCount = 1;
            else if (val >= 2 && val <= 3) planetCount = 2;
            else if (val >= 4 && val <= 5) planetCount = 3;
            else if (val === 6) planetCount = 4;
          }
          continue;
        }

        // ищем 4d6: (a + b + c + d) = sum
        const d6Match = line.match(/4d6\s*:\s*\(([\d\s\+]+)\)\s*=\s*(\d+)/i);
        if (d6Match) {
          // вытаскиваем числа из скобок
          const numbersStr = d6Match[1];
          const numbers = numbersStr.split('+').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n >= 1 && n <= 6);
          if (numbers.length === 4) {
            typeRolls = numbers;
          } else {
            // fallback: попробуем взять сумму, но нам нужны отдельные
            // если не вышло, попробуем извлечь все цифры из скобок
            const allNums = numbersStr.match(/\d+/g);
            if (allNums && allNums.length === 4) {
              typeRolls = allNums.map(n => parseInt(n, 10)).filter(n => n >= 1 && n <= 6);
            }
          }
          continue;
        }

        // ищем 1d20: (X) = Y ...
        const d20Match = line.match(/1d20\s*:\s*\((\d+)\)\s*=\s*(\d+)/i);
        if (d20Match) {
          const val = parseInt(d20Match[2], 10);
          if (!isNaN(val) && val >= 1 && val <= 20) {
            featureRoll = val;
          }
          continue;
        }
      }

      // если количество не найдено, но есть типы, пробуем найти первое число в строке с "количество"
      if (planetCount === null) {
        for (let line of lines) {
          const cntMatch = line.match(/количество\s*планет/i);
          if (cntMatch) {
            const num = line.match(/\b([1-4])\b/);
            if (num) {
              planetCount = parseInt(num[1], 10);
              break;
            }
          }
        }
      }

      // если всё ещё null, пробуем найти просто цифру 1-4 в строке где есть 1d6
      if (planetCount === null) {
        for (let line of lines) {
          if (/1d6/i.test(line)) {
            const num = line.match(/\b([1-4])\b/);
            if (num) {
              planetCount = parseInt(num[1], 10);
              break;
            }
          }
        }
      }

      return { planetCount, typeRolls, featureRoll };
    }

    // ---- отрисовка ----
    function renderSystem(planetCount, typeRolls, featureRoll) {
      if (planetCount === null || planetCount < 1 || planetCount > 4) {
        systemContainer.innerHTML = `<div class="empty-state">⚠️ Не удалось определить количество планет (1d6). Проверьте формат.</div>`;
        return;
      }

      if (!typeRolls || typeRolls.length !== 4) {
        systemContainer.innerHTML = `<div class="empty-state">⚠️ Не удалось получить 4 значения типов (4d6). Проверьте формат.</div>`;
        return;
      }

      // берём первые planetCount типов (по правилам: первые N из 4d6)
      const usedTypes = typeRolls.slice(0, planetCount);

      // строим строку
      let html = `<div class="planet-system">`;
      // html += `<div class="system-row">`;
      // // html += `<span class="sys-label">🌌 Система</span>`;
      // html += `<span style="color:#b8d6f0; font-weight:500;">${planetCount} планеты</span>`;

      // // html += `<span class="meta-info">⭐ родной тип: B (умеренный)</span>`;
      // html += `</div>`;

      // каждая планета
      for (let i = 0; i < usedTypes.length; i++) {
        const val = usedTypes[i];
        const info = TYPE_MAP[val];
        if (!info) continue;

        const isNative = (val === NATIVE_TYPE);
        const label = isNative ? '⭐ колонизируема' : '⛏️ добывающая станция';

        html += `<div class="system-row" style="border-left-color: ${isNative ? '#f5c542' : '#4d7b9e'};">`;
        html += `<span class="sys-label" style="min-width:70px;">Планета ${i+1}</span>`;
        html += `<span class="planet-tag ${info.class}"><span>${info.letter}</span> ${info.name}</span>`;
        html += `<span style="color:#b0ccdf; font-size:0.9rem; margin-left:0.2rem;"></span>`;
        html += `</div>`;
      }

      // если планет меньше 4, покажем оставшиеся типы (но по правилам они не используются)
      // if (usedTypes.length < 4) {
      //   const remaining = typeRolls.slice(usedTypes.length);
      //   if (remaining.length > 0) {
      //     const remainStr = remaining.map(v => `${TYPE_MAP[v]?.letter || v}`).join(' ');
      //     html += `<div style="color:#7f9ab5; font-size:0.8rem; padding:0.5rem 0.8rem; background:#1a3146; border-radius:2rem; margin-top:0.3rem; text-align:center;">
      //       🔄 неиспользованные типы: ${remainStr}
      //     </div>`;
      //   }
      // }

      // ---- Вывод особенностей системы (1d20) ----
      let featureName = "не определено";
      let featureColor = "#7f9ab5"; // серый по умолчанию

      if (featureRoll !== null) {
        // Ищем название особенности по значению кубика
        for (const [name, values] of Object.entries(FEATURE_MAP)) {
          if (values.includes(featureRoll)) {
            featureName = name;
            // Можно добавить цвета для разных типов особенностей, если нужно
            if (name === "нет особенностей") featureColor = "#7f9ab5";
            else if (["богатые недра", "торговый форпост"].includes(name)) featureColor = "#4cd67d"; // зеленый
            else if (["древние руины", "аномальная гравитация"].includes(name)) featureColor = "#d64c9e"; // розовый/фиолетовый
            else featureColor = "#d69e4c"; // оранжевый для опасностей/баз
            break;
          }
        }
        
        html += `<div class="system-row" style="margin-top: 0.5rem; border-left-color: ${featureColor};">`;
        html += `<span class="sys-label">🎲 Особенность</span>`;
        html += `<span style="color:${featureColor}; font-weight:500;">${featureName} (1d20: ${featureRoll})</span>`;
        html += `</div>`;
      } else {
         // Если бросок не найден, можно вывести заглушку или ничего
         // html += `<div style="color:#7f9ab5; font-size:0.8rem; text-align:center; margin-top:0.5rem;">Бросок 1d20 не найден</div>`;
      }

      html += `</div>`;
      systemContainer.innerHTML = html;
    }

    // ---- удаление трёх последних строк ----
    function removeLastFourLines() {
      const lines = textarea.value.split('\n');
      
      // Проверяем, что есть хотя бы 3 строки
      if (lines.length < 4) {
        textarea.value = ""
        decode();
        return;
      }
      
      // Удаляем последние 3 строки
      const remainingLines = lines.slice(0, -4);
      textarea.value = remainingLines.join('\n');
      
      // Автоматически запускаем расшифровку после удаления
      decode();
    }

    // ---- основная функция расшифровки ----
    function decode() {
      const raw = textarea.value;
      if (!raw.trim()) {
        systemContainer.innerHTML = `<div class="empty-state">📭 Вставьте результаты бросков.</div>`;
        return;
      }

      const { planetCount, typeRolls, featureRoll } = parseDiceResults(raw);
      renderSystem(planetCount, typeRolls, featureRoll);
    }
    
    // ---- обработчики ----
    decodeBtn.addEventListener('click', decode);
    diceInput.addEventListener('input', decode);
    document.getElementById('removeLinesBtn').addEventListener('click', removeLastFourLines);

    // автозапуск при загрузке с примером (если поле пустое)
    window.addEventListener('DOMContentLoaded', function() {
    });

    // дополнительно: если пользователь вставляет что-то, можно по ctrl+enter
    textarea.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        decode();
      }
    });
  })();
</script>
</body>
</html>
